   19 - 22 s   vechtwolk: NAM NAM NAM

   27 - 34 s   de kip rijdt achter het huis langs, rondje, stapt uit bij de deur en huilt
   37 - 45 s   koeien met messen, vlammenwerpers en tanks vallen aan
   45 - 50 s   mist, rode lucht, de zon valt op de koeien
   51 - 59 s   zwart scherm, GOD kip groeit en praat
